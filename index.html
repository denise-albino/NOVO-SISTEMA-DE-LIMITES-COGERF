<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Planejamento e Gestão - SPG</title>

  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">

  <style>
    :root { --gd:#1e8554; --gm:#2e7d47; --ga:#3a9a5c; --gl:#e8f5ed; --gb:#b2dfca; --acc:#00a651; --red:#c0392b; --td:#1a2e22; --tm:#3d5a47; --tl:#6b8c78; --wh:#fff; --bg:#f4faf6; --bd:#d4e6db; --sidebar-b:#e9eae9; }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'IBM Plex Sans',sans-serif;background:var(--bg);color:var(--td);min-height:100vh;font-size:13px}
    .topbar{background:var(--gd);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:12px 24px}
    .topbar-left{display:flex;align-items:center;gap:12px}
    .logo{width:34px;height:34px;background:rgba(0,0,0,0.2);border-radius:50%;display:flex;align-items:center;justify-content:center}
    .topbar-right{display:flex;align-items:center;gap:12px}
    .layout{display:flex;min-height:calc(100vh - 65px)}
    .sidebar{width:240px;background:var(--sidebar-b);padding:0}
    .sidebar-user{display:flex;flex-direction:column;padding:20px 14px 16px 16px;border-bottom:1px solid #ccc}
    .sidebar-adv{width:70px;height:70px;border-radius:50%;background:#a3b4c1;display:flex;align-items:center;justify-content:center}
    .main{flex:1;padding:24px 28px;overflow-x:auto}
    .breadcrumb{font-size:11.5px;color:var(--ga);margin-bottom:16px}
    .step-sel{display:flex;gap:18px;margin-bottom:24px}
    .step-card{flex:1;border:2px solid var(--bd);border-radius:10px;padding:20px 20px}
    .step-card .title{font-size:11px;font-weight:700;color:var(--gm)}
    .item-block{border:1px solid var(--bd);padding:12px 12px 4px;margin-bottom:12px}
    .gid-block{border:1px solid var(--bd);padding:12px;margin-top:8px}
    .duod-wrap{border-radius:6px;padding:8px;margin-top:8px}
    .dm{width:100%;display:inline-block}
    .dm-head{font-size:12px;font-weight:600}
    .dm-body{display:flex;gap:8px;align-items:center}
    .df{display:flex;flex-direction:column}
    .error-msg-box{display:none;background:#fff1f0;border:1px solid #ffc9c6;padding:8px;border-radius:6px;margin-top:8px;color:#7a1f18}
    .has-error{box-shadow:0 0 0 2px rgba(255,0,0,0.05)}
    .btn-action-small{background:var(--gd);color:#fff;border:0;padding:6px 10px;border-radius:6px;cursor:pointer}
    .hidden{display:none}
    table{width:100%;border-collapse:collapse}
    table tr.cat-hd td{background:#f7f9f7;padding:8px;font-weight:700}
    table tr.grand-row td{background:#e9f7ef;padding:8px;font-weight:800}
    .num-badge{background:#e6e6e6;padding:4px 6px;border-radius:6px;margin-right:8px}
  </style>
</head>
<body>
<div class="topbar">
  <div class="topbar-left">
    <div class="logo">SPG</div>
    <div>
      <div style="font-weight:700">SEPLAG</div>
      <div style="font-size:12px;opacity:.9">Governo do Estado do Ceará</div>
    </div>
  </div>
  <div class="topbar-right">
    <div class="help-link"><span>Precisa de ajuda?</span></div>
  </div>
</div>

<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-user">
      <div class="sidebar-adv"><svg viewBox="0 0 24 24" width="60" height="60" fill="#6d8294"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5-4-8-4z"/></svg></div>
      <div class="sidebar-name">DENISE MARIA ALBINO MELO</div>
    </div>
  </aside>

  <main class="main">
    <div class="breadcrumb">SPG > Limite COGERF</div>

    <div id="stepSel" class="step-sel">
      <div class="step-card">
        <div class="title">Suplementação</div>
        <div class="desc">Solicitar acréscimo ao limite financeiro...</div>
      </div>
      <div class="step-card">
        <div class="title">Remanejamento</div>
        <div class="desc">Transferir saldo entre MAPPs ou GIDs.</div>
      </div>
    </div>

    <div id="mainForm" class="hidden">
      <div id="suplementacaoSection" class="hidden">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
          <div><strong id="tipoBadge">TIPO</strong></div>
          <div>
            <button id="btnAddSupl" class="btn-action-small">+ Adicionar MAPP</button>
          </div>
        </div>
        <div id="suplBlocks"></div>
      </div>

      <div id="remanejamentoSection" class="hidden">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
          <div><strong>Remanejamento</strong></div>
          <div>
            <button id="btnAddRemaj" class="btn-action-small">+ Adicionar Remanejamento</button>
          </div>
        </div>
        <div id="remajBlocks"></div>
      </div>

      <div style="margin-top:16px;display:flex;gap:12px;align-items:flex-start">
        <div style="flex:1">
          <div class="fc">
            <label class="fl req">Justificativa</label>
            <textarea id="justificativa" style="width:100%;height:80px;padding:8px;border-radius:6px;border:1px solid #e6e6e6"></textarea>
          </div>
          <div style="margin-top:8px;display:flex;gap:8px;align-items:center">
            <button class="btn-action-small" onclick="resetForm()">Cancelar</button>
            <button id="btnSalvar" class="btn-action-small" style="background:#2ecc71">Salvar</button>
            <button id="btnClearDraft" class="btn-action-small" style="background:#fff;border:1px solid #ddd;color:#c0392b;margin-left:8px;">Limpar rascunho</button>
          </div>
        </div>
        <div style="width:420px">
          <div style="background:#fff;padding:12px;border-radius:8px;border:1px solid #e6e6e6">
            <h4 style="margin-bottom:8px">Resumo</h4>
            <div style="max-height:300px;overflow:auto">
              <table><tbody id="resumoBody"></tbody></table>
            </div>
          </div>

          <!-- attachments preview placed next to summary for convenience -->
          <div style="background:#fff;padding:12px;border-radius:8px;border:1px solid #e6e6e6;margin-top:12px">
            <h4 style="margin-bottom:8px">Anexos</h4>
            <input type="file" id="fileInput" multiple style="width:100%" />
            <div id="attachmentsList" style="margin-top:8px"></div>
          </div>
        </div>
      </div>

    </div>

    <div style="margin-top:20px">
      <div style="font-size:12px;color:#888">Exporte/Compartilhe</div>
    </div>

  </main>
</div>

<script src="assets/js/limites.js"></script>
</body>
</html>
