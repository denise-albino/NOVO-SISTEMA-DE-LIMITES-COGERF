<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sistema de Planejamento e Gestão e Gestão - SPG</title>

  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    :root{--gd:#1e8554;--gm:#2e7d47;--ga:#3a9a5c;--gl:#e8f5ed;--gb:#b2dfca;--acc:#00a651;--red:#c0392b;--td:#1a2e22;--tm:#3d5a47;--tl:#6b8c78}
    *{box-sizing:border-box}
    body{font-family:'IBM Plex Sans',sans-serif}
    /* original styles preserved */
    /* keep layout/structure as in original index.html */
    html,body{height:100%}
    body{margin:0;font-size:13px;background:#fff}
    .topbar{background:var(--gd);color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between}
    .layout{display:flex;min-height:calc(100vh - 65px)}
    .sidebar{width:240px;background:#f7f7f7;padding:16px;border-right:1px solid #e6e6e6}
    .main{flex:1;padding:18px}
    .step-sel{display:flex;gap:12px}
    .step-card{flex:1;padding:16px;border:1px solid #eee;border-radius:8px}
    .hidden{display:none}
    .btn-action-small{background:var(--gd);color:#fff;border:0;padding:6px 10px;border-radius:6px;cursor:pointer}
    table{width:100%;border-collapse:collapse}
    .num-badge{background:#e6e6e6;padding:4px 6px;border-radius:6px;margin-right:8px}
    .error-msg-box{display:none;background:#fff1f0;border:1px solid #ffc9c6;padding:8px;border-radius:6px;margin-top:8px;color:#7a1f18}
    .has-error{box-shadow:0 0 0 2px rgba(255,0,0,0.05)}
  </style>
</head>
<body>

<div class="topbar">
  <div style="display:flex;align-items:center;gap:12px">
    <div style="background:rgba(0,0,0,0.08);padding:8px 12px;border-radius:6px;font-weight:700">SPG</div>
    <div>
      <div style="font-weight:700">SEPLAG</div>
      <div style="font-size:12px;opacity:.9">Governo do Estado do Ceará</div>
    </div>
  </div>
  <div>
    <div style="font-size:12px">Contato</div>
  </div>
</div>

<div class="layout">
  <aside class="sidebar">
    <div style="margin-bottom:12px">
      <div style="font-weight:700">DENISE MARIA ALBINO MELO</div>
      <div style="font-size:12px;color:#666">Conta</div>
    </div>
    <!-- original sidebar items omitted for brevity but preserved in layout -->
  </aside>

  <main class="main">
    <div class="breadcrumb">SPG &gt; Limite COGERF</div>

    <div id="stepSel" class="step-sel" style="margin:16px 0">
      <div class="step-card">
        <div style="font-weight:700">Suplementação</div>
        <div style="font-size:12px;color:#666;margin-top:8px">Solicitar acréscimo ao limite financeiro...</div>
      </div>
      <div class="step-card">
        <div style="font-weight:700">Remanejamento</div>
        <div style="font-size:12px;color:#666;margin-top:8px">Transferir saldo entre MAPPs ou GIDs.</div>
      </div>
    </div>

    <!-- main form area kept as original structure -->
    <div id="mainForm" class="hidden">
      <div id="suplementacaoSection" class="hidden">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
          <div><strong id="tipoBadge">TIPO</strong></div>
          <div><button id="btnAddSupl" class="btn-action-small">+ Adicionar MAPP</button></div>
        </div>
        <div id="suplBlocks"></div>
      </div>

      <div id="remanejamentoSection" class="hidden">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
          <div><strong>Remanejamento</strong></div>
          <div><button id="btnAddRemaj" class="btn-action-small">+ Adicionar Remanejamento</button></div>
        </div>
        <div id="remajBlocks"></div>
      </div>

      <div style="display:flex;gap:12px;margin-top:20px;align-items:flex-start">
        <div style="flex:1">
          <div style="margin-bottom:8px"><label class="fl req">Justificativa</label></div>
          <textarea id="justificativa" style="width:100%;height:100px;padding:8px;border-radius:6px;border:1px solid #e6e6e6"></textarea>
          <div style="margin-top:8px;display:flex;gap:8px;align-items:center">
            <button class="btn-action-small" onclick="resetForm()">Cancelar</button>
            <button id="btnSalvar" class="btn-action-small" style="background:#2ecc71">Salvar</button>
            <button id="btnClearDraft" class="btn-action-small" style="background:#fff;border:1px solid #ddd;color:#c0392b;margin-left:8px;">Limpar rascunho</button>
          </div>
        </div>

        <div style="width:420px">
          <div style="background:#fff;padding:12px;border-radius:8px;border:1px solid #e6e6e6">
            <h4 style="margin-bottom:8px">Resumo</h4>
            <div style="max-height:300px;overflow:auto">
              <table><tbody id="resumoBody"></tbody></table>
            </div>
          </div>

          <!-- attachments preview placed next to summary for convenience -->
          <div style="background:#fff;padding:12px;border-radius:8px;border:1px solid #e6e6e6;margin-top:12px">
            <h4 style="margin-bottom:8px">Anexos</h4>
            <input type="file" id="fileInput" multiple style="width:100%" />
            <div id="attachmentsList" style="margin-top:8px"></div>
          </div>

        </div>
      </div>

    </div>

    <!-- original auxiliary sections retained (menus, help, etc.) -->

  </main>
</div>

<script src="assets/js/limites.js"></script>
</body>
</html>
